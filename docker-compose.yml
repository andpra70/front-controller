services:
  front-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/andpra70/front-controller:latest
    container_name: front-controller
    restart: unless-stopped
    depends_on:
      galleria:
        condition: service_started
      minicms:
        condition: service_started
      watermarks:
        condition: service_started
      catalogo-opere:
        condition: service_started
      crawler:
        condition: service_started
      calendario:
        condition: service_started
      camera:
        condition: service_started
      gpdr:
        condition: service_started
      ginnastica:
        condition: service_started
      trumpet:
        condition: service_started
      tuner:
        condition: service_started
      fileserver:
        condition: service_started
      plotterfun-node-editor:
        condition: service_started
      oauth-server:
        condition: service_healthy
      vfs-service:
        condition: service_healthy
      example:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - public-edge
      - internal-services
    volumes:
      - nginx-certs:/etc/nginx-certs:ro
      - certbot-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: front-controller-certbot
    restart: unless-stopped
    depends_on:
      front-controller:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/certbot-renew.sh
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - nginx-certs:/etc/nginx-certs
      - certbot-webroot:/var/www/certbot
      - ./docker/certbot/certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro

  galleria:
    build:
      context: ../app/galleria
      dockerfile: Dockerfile
    image: docker.io/andpra70/galleria-virtuale:latest
    container_name: galleria-virtuale
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  minicms:
    build:
      context: ../app/minicms
      dockerfile: Dockerfile
    image: docker.io/andpra70/minicms:latest
    container_name: minicms
    restart: unless-stopped
    networks:
      - internal-services

  watermarks:
    image: docker.io/andpra70/watermarks:latest
    container_name: watermark
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  catalogo-opere:
    build:
      context: ../app/catalogo
      dockerfile: Dockerfile
    image: docker.io/andpra70/catalogo-opere:latest
    container_name: catalogo-opere
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  crawler:
    image: docker.io/andpra70/crawler:latest
    container_name: crawler
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - public-edge
      - internal-services

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      MONGO_RUNTIME_PASSWORD: ${MONGO_RUNTIME_PASSWORD:-rootpass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_RUNTIME_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
          | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - public-edge
      - internal-services

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_RUNTIME_PASSWORD:-rootpass}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-adminpass}
      ME_CONFIG_SITE_BASEURL: /mongo-express
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    networks:
      - public-edge
      - internal-services

  redis:
    image: redis:7-alpine
    container_name: vfs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal-services

  minio:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: vfs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vfsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal-services

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-02-08T19-14-21Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vfsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/public-assets &&
        mc anonymous set download local/public-assets
    networks:
      - internal-services

  vfs-service:
    build:
      context: ../app/vfs2
      dockerfile: Dockerfile
    image: docker.io/andpra70/vfs2-service:latest
    container_name: vfs2-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3002
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: public-assets
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-vfsadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      JWT_ISSUER: ${JWT_ISSUER:-vfs-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vfs-clients}
      ALLOWED_ORIGINS: https://${DOMAIN},https://localhost
      PUBLIC_KEY_PATH: /run/secrets/public.pem
    volumes:
      - ../app/vfs2/keys/public.pem:/run/secrets/public.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal-services

  example:
    build:
      context: ../app/example
      dockerfile: Dockerfile
    image: docker.io/andpra70/vfs-example:latest
    container_name: vfs-example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal-services

  calendario:
    image: docker.io/andpra70/calendario:latest
    container_name: calendario
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  camera:
    image: docker.io/andpra70/ubuntu-camera-viewer:latest
    container_name: camera
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_PATH: /camera/
      TRUST_PROXY_HOPS: "1"
      CAMERA_ALLOWLIST: ""
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - "c 81:* rwm"
    networks:
      - internal-services

  gpdr:
    image: docker.io/andpra70/gdpr-compliance-widget:latest
    container_name: gpdr
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  ginnastica:
    image: docker.io/andpra70/ginnastica-calistenics-app:latest
    container_name: ginnastica
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  trumpet:
    build:
      context: ../app/trumpet
      dockerfile: Dockerfile
    image: docker.io/andpra70/trumpet:latest
    container_name: front-controller-trumpet
    restart: unless-stopped
    networks:
      - internal-services

  tuner:
    image: docker.io/andpra70/tuner:latest
    container_name: front-controller-tuner
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  fileserver:
    build:
      context: ../app/fileserver
      dockerfile: Dockerfile
    image: docker.io/andpra70/fileserver:latest
    container_name: front-controller-fileserver
    restart: unless-stopped
    networks:
      - public-edge
      - internal-services

  oauth-server:
    build:
      context: ../app/oauth-server
      dockerfile: Dockerfile
    image: docker.io/andpra70/oauth-server:latest
    container_name: oauth-server
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 9000
      BASE_PATH: /oauth-server
      ISSUER: https://${DOMAIN}/oauth-server
      TRUST_PROXY: "true"
      TWO_FACTOR_ENABLED: "false"
      CONSENT_ENABLED: "false"
      GOOGLE_OAUTH_ENABLED: "true"
      PASSKEY_ENABLED: "true"
      CONFIRM_LOGOUT: "false"
      COOKIE_KEYS: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env},${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env},${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_EMAIL: ${OAUTH_ADMIN_EMAIL:-admin@example.local}
      DEFAULT_CLIENT_ID: fileserver-web
      DEFAULT_CLIENT_AUTH_METHOD: none
      DEFAULT_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      SETUP_TOKEN: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost},https://localhost
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_CALLBACK_PATH: /auth/api/callback
      GOOGLE_CALLBACK_URL: https://${DOMAIN}/auth/api/callback
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_RUNTIME_PASSWORD:-rootpass}@mongo:27017/oauth2?authSource=admin
      REDIS_URL: redis://redis:6379/0
      VFS_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      VFS_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      VFS_GOOGLE_CALLBACK_URL: https://${DOMAIN}/auth/api/callback
      VFS_GOOGLE_CALLBACK_URLS: https://${DOMAIN}/auth/api/callback,https://localhost/auth/api/callback
      VFS_JWT_ISSUER: ${JWT_ISSUER:-vfs-auth}
      VFS_JWT_AUDIENCE: ${JWT_AUDIENCE:-vfs-clients}
      VFS_PRIVATE_KEY_PATH: /run/secrets/private.pem
      ADMIN_GOOGLE_SUBS: ${ADMIN_GOOGLE_SUBS:-}
    ports:
      - "9000:9000"
    volumes:
      - oauth-server-data:/app/data/oauth
      - ../app/oauth-server/keys/private.pem:/run/secrets/private.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "Promise.all([fetch('http://127.0.0.1:9000/oauth-server/health'),fetch('http://127.0.0.1:9000/healthz')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - public-edge
      - internal-services

  plotterfun-node-editor:
    image: ${IMAGE_REF:-docker.io/andpra70/plotterfun-node-editor:latest}
    container_name: plotterfun-node-editor
    restart: unless-stopped
    networks:
      - internal-services

networks:
  public-edge:
    driver: bridge
  internal-services:
    driver: bridge
    internal: true

volumes:
  certbot-webroot:
  nginx-certs:
  oauth-server-data:
