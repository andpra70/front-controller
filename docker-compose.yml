services:
  front-controller:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/andpra70/front-controller:latest
    container_name: front-controller
    restart: unless-stopped
    depends_on:
      galleria:
        condition: service_started
      minicms:
        condition: service_started
      watermarks:
        condition: service_started
      catalogo-opere:
        condition: service_started
      crawler:
        condition: service_started
      calendario:
        condition: service_started
      camera:
        condition: service_started
      ginnastica:
        condition: service_started
      trumpet:
        condition: service_started
      tuner:
        condition: service_started
      fileserver:
        condition: service_started
      plotterfun-node-editor:
        condition: service_started
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - public-edge
      - internal-services
    volumes:
      - nginx-certs:/etc/nginx-certs:ro
      - certbot-webroot:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    container_name: front-controller-certbot
    restart: unless-stopped
    depends_on:
      front-controller:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/certbot-renew.sh
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - nginx-certs:/etc/nginx-certs
      - certbot-webroot:/var/www/certbot
      - ./docker/certbot/certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro

  galleria:
    image: docker.io/andpra70/galleria-virtuale:latest
    container_name: galleria-virtuale
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  minicms:
    image: docker.io/andpra70/minicms:latest
    container_name: minicms
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  watermarks:
    image: docker.io/andpra70/watermarks:latest
    container_name: watermark
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  catalogo-opere:
    image: docker.io/andpra70/catalogo-opere:latest
    container_name: catalogo-opere
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  crawler:
    image: docker.io/andpra70/crawler:latest
    container_name: crawler
    pull_policy: always
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - public-edge
      - internal-services

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
          | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - public-edge
      - internal-services

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-rootpass}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-adminpass}
      ME_CONFIG_SITE_BASEURL: /mongo-express
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    networks:
      - public-edge
      - internal-services

  calendario:
    image: docker.io/andpra70/calendario:latest
    container_name: calendario
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  camera:
    image: docker.io/andpra70/ubuntu-camera-viewer:latest
    container_name: camera
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "3000"
      BASE_PATH: /camera/
      TRUST_PROXY_HOPS: "1"
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}
    networks:
      - internal-services

  ginnastica:
    image: docker.io/andpra70/ginnastica-calistenics-app:latest
    container_name: ginnastica
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  trumpet:
    image: docker.io/andpra70/trumpet:latest
    container_name: front-controller-trumpet
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  tuner:
    image: docker.io/andpra70/tuner:latest
    container_name: front-controller-tuner
    pull_policy: always
    restart: unless-stopped
    networks:
      - internal-services

  fileserver:
    image: docker.io/andpra70/fileserver:latest
    container_name: front-controller-fileserver
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: 8080
      APP_BASE: /
      CLIENT_DIST: /app/client-dist
      VOLUME_ROOT: /data
      CORS_ORIGIN: https://${DOMAIN:-localhost}
      MAX_EDITABLE_BYTES: 26214400
      MAX_BINARY_FILE_BYTES: 52428800
      OAUTH_ALLOW_SELF_SIGNED_TLS: "true"
      TOKEN_VALIDATION_CACHE_TTL_MS: 15000
    volumes:
      - ./data/files:/data
    networks:
      - public-edge
      - internal-services

  oauth-server:
    image: docker.io/andpra70/oauth-server:latest
    container_name: oauth-server
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost},https://localhost
    ports:
      - "9000:9000"
    volumes:
      - oauth-server-data:/app/data/oauth
    networks:
      - public-edge
      - internal-services

  plotterfun-node-editor:
    image: ${IMAGE_REF:-docker.io/andpra70/plotterfun-node-editor:latest}
    container_name: plotterfun-node-editor
    restart: unless-stopped
    networks:
      - internal-services

networks:
  public-edge:
    driver: bridge
  internal-services:
    driver: bridge
    internal: true

volumes:
  certbot-webroot:
  nginx-certs:
  oauth-server-data:
