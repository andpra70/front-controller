log_format upstream_timing '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time" '
                          'ua="$upstream_addr" us="$upstream_status"';

limit_req_zone $binary_remote_addr zone=dos_guard:10m rate=5r/s;

map $http_x_forwarded_host $fc_x_forwarded_host {
    default $http_x_forwarded_host;
    "" $http_host;
}

map $http_x_forwarded_proto $fc_x_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_port $fc_x_forwarded_port {
    default $http_x_forwarded_port;
    "" $fc_public_port;
}

map $scheme $fc_public_port {
    default 443;
    http 80;
}

map $http_forwarded $fc_forwarded {
    default $http_forwarded;
    "" "for=$remote_addr;proto=$fc_x_forwarded_proto;host=$fc_x_forwarded_host";
}

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;
    ssl_certificate /tmp/front-controller-tls/fullchain.pem;
    ssl_certificate_key /tmp/front-controller-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $fc_x_forwarded_host;
    proxy_set_header X-Forwarded-Port $fc_x_forwarded_port;
    proxy_set_header X-Forwarded-Proto $fc_x_forwarded_proto;
    proxy_set_header Forwarded $fc_forwarded;
    client_max_body_size 100m;
    limit_req_status 429;
    access_log /var/log/nginx/front-controller-access.log upstream_timing;

    location = / {
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /__speedtest__/download {
        add_header Cache-Control "no-store";
        try_files /speedtest.bin =404;
    }

    location = /__speedtest__/upload {
        add_header Cache-Control "no-store";
        limit_except POST {
            deny all;
        }
        return 204;
    }

    location = /catalogo-opere {
        return 301 /catalogo-opere/;
    }

    location /catalogo-opere/ {
        proxy_pass http://catalogo-opere:8080/;
    }

    location = /galleria {
        return 301 /galleria/;
    }

    location /galleria/ {
        proxy_pass http://galleria:8080/;
    }

    location = /minicms {
        return 301 /minicms/;
    }

    location /minicms/ {
        proxy_pass http://minicms:8080/;
    }

    location = /watermarks {
        return 301 /watermarks/;
    }

    location /watermarks/ {
        proxy_pass http://watermarks:80/;
    }

    location = /crawler {
        return 301 /crawler/;
    }

    location /crawler/ {
        proxy_pass http://crawler:80/;
    }

    location = /calendario {
        return 301 /calendario/;
    }

    location /calendario/ {
        proxy_pass http://calendario:80/;
    }

    location = /camera {
        return 301 /camera/;
    }

    location /camera/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://camera:3000;
    }

    location = /gpdr {
        return 301 /gpdr/;
    }

    location /gpdr/ {
        proxy_pass http://gpdr:8080/;
    }

    location = /ginnastica {
        return 301 /ginnastica/;
    }

    location /ginnastica/ {
        proxy_pass http://ginnastica:8080/;
    }

    location = /trumpet {
        return 301 /trumpet/;
    }

    location /trumpet/ {
        proxy_pass http://trumpet:8080/;
    }

    location = /tuner {
        return 301 /tuner/;
    }

    location /tuner/ {
        proxy_pass http://tuner:80/;
    }

    location = /fileserver {
        return 301 /fileserver/;
    }

    location /fileserver/ {
        proxy_pass http://fileserver:8080/;
    }

    location = /oauth-server {
        return 301 /oauth-server/;
    }

    location /oauth-server/ {
        proxy_pass http://oauth-server:9000;
    }

    location = /auth/widget.js {
        proxy_pass http://auth-service:3001/widget.js;
        add_header Cache-Control "public, max-age=300";
    }

    location /auth/api/ {
        proxy_pass http://auth-service:3001/api/;
    }

    location = /auth/admin {
        return 301 /auth/admin/;
    }

    location /auth/admin/ {
        proxy_pass http://auth-service:3001/admin/;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "DENY" always;
    }

    location = /vfs/widget.js {
        proxy_pass http://vfs-service:3002/widget.js;
        add_header Cache-Control "public, max-age=300";
    }

    location /vfs/api/ {
        proxy_pass http://vfs-service:3002/api/;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~ ^/vfs/files/(.+)$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://minio:9000/public-assets/$1$is_args$args;
        proxy_buffering off;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    location = /example {
        return 301 /example/;
    }

    location /example/ {
        set $example_upstream http://example:8080;
        rewrite ^/example/(.*)$ /$1 break;
        proxy_pass $example_upstream;
    }

    location = /mongo-express {
        return 301 /mongo-express/;
    }

    location /mongo-express/ {
        set $mongo_express_upstream http://mongo-express:8081;
        proxy_pass $mongo_express_upstream;
    }

    location = /plotterfun-node-editor {
        return 301 /plotterfun-node-editor/;
    }

    location /plotterfun-node-editor/ {
        proxy_pass http://plotterfun-node-editor:80/;
    }

}
